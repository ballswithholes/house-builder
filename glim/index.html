<script>
(function(){'use strict';
  window.__errs = [];
  function crash(msg){ try{ var c=document.getElementById('crash'); if(!c) return; c.classList.add('on');
    if(/[?&]debug/.test(location.search) && msg){ var d=document.getElementById('crashMsg'); if(d) d.textContent=String(msg).slice(0,400); } }catch(e){} }
  window.__showCrash = crash;
  window.addEventListener('error', function(e){ window.__errs.push(String(e && (e.message||e.error)||'error')); if(!window.__booted) crash(e && e.message); });
  window.addEventListener('unhandledrejection', function(e){ try{ e.preventDefault(); }catch(_){} window.__errs.push('rejection: '+String(e && e.reason)); });
  setTimeout(function(){ if(!window.__booted) crash('boot timeout'); }, 4000);
  document.addEventListener('click', function(e){ var t=e.target; if(!t||!t.closest||!t.closest('#crashBtn')) return;
    try{ location.reload(); }catch(_){ try{ document.getElementById('crash').classList.remove('on'); window.__softReset && window.__softReset(); }catch(__){} } });
})();
</script>
<style>
:root{--ink:#1E1428;--paper:#FFF4E0;--paper-2:#F3E3C7;--amber:#FFB347;--amber-hot:#FFE08A;--ember:#E8743B;--thorn:#FF5A5F;--mint:#7FE0B5;--scrim:rgba(30,20,40,.55);
 --st:max(12px,env(safe-area-inset-top));--sb:max(16px,env(safe-area-inset-bottom));--sl:max(16px,env(safe-area-inset-left));--sr:max(16px,env(safe-area-inset-right));
 --ease:cubic-bezier(.22,1,.36,1)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1E1428}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;color:var(--ink);
 font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;font-weight:600}
#stage{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;outline:none;z-index:0}
canvas{display:block;width:100%;height:100%}
#ui,#hud,#fx{position:fixed;inset:0;pointer-events:none}
#fx{z-index:1}#hud{z-index:2}#ui{z-index:3}
.panel,#pauseBtn,.pe{pointer-events:auto}
button{touch-action:manipulation;font:inherit;color:inherit;border:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.scroll{touch-action:pan-x;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.vscroll{touch-action:pan-y;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}
#fx .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(30,20,40,.35))}
#fx .grain{position:absolute;inset:0;opacity:.06;background-size:128px 128px}
#fx .scr{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:opacity}#dimFx{background:#1E1428}
.cap{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.chip{background:var(--paper);color:var(--ink);border-radius:18px;box-shadow:0 4px 0 rgba(30,20,40,.25);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,20,40,.25)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;font-size:17px;font-weight:700}
.primary{background:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(30,20,40,.25);font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.pill svg{width:20px;height:20px}
.mote-ic{color:#E8A23B}
/* HUD */
#hud>*{position:absolute}
#score{left:0;right:0;top:calc(var(--st) + 8px);text-align:center;font-size:56px;font-weight:800;line-height:1;color:var(--paper);text-shadow:0 3px 0 #1E1428,0 0 2px #1E1428,0 0 8px rgba(30,20,40,.45);font-variant-numeric:tabular-nums;will-change:transform}
#multRow{left:0;right:0;top:calc(var(--st) + 70px);display:flex;justify-content:center;align-items:center;gap:8px;height:30px}
#mult{height:28px;padding:0 10px;border-radius:14px;background:var(--paper);color:var(--ink);font-weight:800;font-size:17px;display:flex;align-items:center;box-shadow:0 3px 0 rgba(30,20,40,.3);opacity:0;transition:opacity .2s}
#mult.on{opacity:1}
.pips{display:flex;gap:5px}.pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,244,224,.35);box-shadow:0 0 0 1.5px rgba(30,20,40,.35),0 2px 0 rgba(30,20,40,.3)}
.pips i.on{background:var(--amber-hot)}.pips.max i{background:var(--amber-hot);animation:pip .5s ease-in-out infinite alternate}
@keyframes pip{to{opacity:.45}}
#hudToast{left:0;right:0;top:calc(var(--st) + 108px);text-align:center;color:var(--paper);text-shadow:0 2px 0 #1E1428,0 0 2px #1E1428,0 0 6px rgba(30,20,40,.5);opacity:0}
#motePill{left:var(--sl);top:var(--st);transition:opacity .2s}
#pups{left:var(--sl);top:calc(var(--st) + 46px);display:flex;flex-direction:column;gap:6px}
.pup{width:36px;height:36px;border-radius:18px;background:var(--paper);box-shadow:0 3px 0 rgba(30,20,40,.25);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pup svg{width:22px;height:22px}.pup b{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;transform-origin:0 50%;background:currentColor}
/* a flyer's trait chip: glyph + recharge ring (gates left) */
.abchip{width:36px;height:36px;border-radius:18px;background:var(--paper);box-shadow:0 3px 0 rgba(30,20,40,.25);display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s}
.abchip .g{width:20px;height:20px;transition:opacity .15s}.abchip.dim .g{opacity:.38}
.abchip .rg{position:absolute;inset:0;width:36px;height:36px;fill:none;stroke-width:3;transform:rotate(-90deg)}
.abchip .rg circle{stroke:rgba(30,20,40,.14)}.abchip .rg .p{stroke:currentColor;stroke-dasharray:97.4;stroke-dashoffset:0;stroke-linecap:round}
.abchip b{position:absolute;right:-7px;bottom:-5px;min-width:18px;height:18px;padding:0 3px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:800;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.abchip b:empty{display:none}.abchip.lit{background:var(--amber-hot)}
/* the flyer's chips (up to 3, bound at run start), stacked under the power-up pills in the 36 px left gutter, clear of the flyer's
   column: spent Rekindle shows an ash glyph; Pull shimmers while it pulls */
#abRow{display:flex;flex-direction:column;gap:6px}
.abchip.spent .g{opacity:.45}.abchip.spent .rg .p{stroke:transparent}
.abchip::after{content:'';position:absolute;inset:-3px;border-radius:21px;border:2px solid #9BE7FF;opacity:0;pointer-events:none}
.abchip.pull::after{animation:pullsh .8s ease-in-out infinite alternate}
@keyframes pullsh{from{opacity:.15}to{opacity:.9}}
#pauseBtn{right:var(--sr);top:var(--st);width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:5px}
#pauseBtn i{width:5px;height:16px;border-radius:3px;background:var(--ink)}
#meterWrap{left:0;right:0;bottom:calc(var(--sb) + 6px);display:flex;justify-content:center;align-items:center;gap:8px;color:var(--paper);text-shadow:0 2px 0 #1E1428,0 0 2px #1E1428,0 0 6px rgba(30,20,40,.5)}
#meter{position:relative;width:min(60vw,320px);height:12px;border-radius:6px;background:rgba(255,244,224,.35);overflow:hidden;box-shadow:0 2px 0 rgba(30,20,40,.3)}
#meterFill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#FFB347,#FFE08A);border-radius:6px}
#meterFull{position:absolute;inset:0;background:#FFF4E0;opacity:0;border-radius:6px}
#meterWrap.full #meterFull{animation:mfull .45s ease-in-out infinite alternate}
@keyframes mfull{from{opacity:0}to{opacity:.6}}
@media (max-width:399px){#motePill{transform:scale(.8);transform-origin:0 50%}}@media (max-width:359px){#score{font-size:44px}}
#rotChip{left:50%;top:calc(var(--st) + 112px);transform:translateX(-50%);padding:8px 14px;border-radius:16px;background:var(--paper);font-size:13px;font-weight:700;opacity:0;transition:opacity .6s;white-space:nowrap}
.hid{display:none!important}
/* panels */
.panel{position:absolute;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility 0s .18s;opacity:0;visibility:hidden;transform:translateY(24px)}
.panel.open{opacity:1;visibility:visible;transform:none;transition:opacity .24s var(--ease),transform .24s var(--ease),visibility 0s}
.panel:not(.open),.panel:not(.open) *{pointer-events:none!important}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.card{background:var(--paper);border-radius:24px;box-shadow:0 6px 0 rgba(30,20,40,.25);padding:20px}
.center{inset:0;display:flex;align-items:center;justify-content:center;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.center>.card{position:relative;width:min(100%,380px);max-height:100%;box-sizing:border-box}
h2{margin:0 0 12px;font-size:28px;font-weight:700;text-align:center}
.row{display:flex;gap:10px}.row>*{flex:1}
.mt{margin-top:10px}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:6px 4px;background:none;text-align:left;font-size:17px;font-weight:600;gap:12px}
.tgl small{display:block;font-size:13px;font-weight:600;opacity:.65;margin-top:2px}
.tgl .sw{flex:none;width:50px;height:30px;border-radius:15px;background:rgba(30,20,40,.2);position:relative;transition:background .15s}
.tgl .sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 0 rgba(30,20,40,.25);transition:transform .15s var(--ease)}
.tgl[aria-pressed=true] .sw{background:var(--amber)}.tgl[aria-pressed=true] .sw::after{transform:translateX(20px)}
.rbtn{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:0}
.rbtn svg{width:26px;height:26px}
.xbtn{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:0}
/* title */
#titleUI{position:absolute;inset:0;transition:opacity .2s}
#titleUI.off{opacity:0;visibility:hidden}
#dailyChip{position:absolute;right:var(--sr);top:var(--st);height:48px;border-radius:24px!important;padding:0 14px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:20px}
@media (max-width:359px){#dailyChip{max-width:120px;padding:0 10px;letter-spacing:0;line-height:15px}} /* 'DAILY · LOW / GRAVITY', clear of the logo's flame */
#titleBottom{position:absolute;left:var(--sl);right:var(--sr);bottom:var(--sb);display:flex;flex-direction:column;align-items:center;gap:14px}
/* the next flyer and how close it is (portrait only: in landscape it would cover 'tap to fly') */
#tNext{align-self:center;max-width:100%;box-sizing:border-box;min-height:48px;margin-bottom:-6px;padding:4px 16px;border-radius:24px;font-size:14px;font-weight:800;line-height:18px;text-align:center}
@media (max-height:520px){#tNext{display:none!important}}
#missionStrip{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;font-size:15px;max-width:100%;box-sizing:border-box}
#missionStrip .badge{background:var(--thorn);color:#fff;border-radius:10px;padding:1px 7px;font-size:13px}
#chipRow{display:flex;align-items:center;gap:14px}
#shopBtn{position:relative}#shopBtn.dot::after{content:'';position:absolute;right:5px;top:5px;width:12px;height:12px;border-radius:6px;background:var(--ember);box-shadow:0 0 0 2px var(--paper)}
#bestPill{height:56px;border-radius:28px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
#bestPill canvas{width:30px;height:30px}
@media (max-width:359px){#chipRow{gap:8px}#bestPill{padding:0 12px;gap:6px}}
/* results */
#results{left:0;right:0;bottom:0;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
#results .sheet{position:relative;width:100%;max-width:420px;max-height:calc(100% - var(--st) - 8px);overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -4px 0 rgba(30,20,40,.2);padding:16px var(--sr) var(--sb) var(--sl);transform:translateY(100%);transition:transform .32s cubic-bezier(.3,1.35,.5,1)}
#results.open .sheet{transform:none}
#results .scrim{background:rgba(30,20,40,.35)}
.rhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.rhead canvas{width:72px;height:72px;flex:none}
#rHeading{font-size:22px;font-weight:800;line-height:1.15}
#rScore{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#rNew{display:inline-block;flex:none;margin-left:auto;align-self:center;background:var(--thorn);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:800;letter-spacing:.1em;transform:rotate(-4deg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:8px 0;font-size:15px}
.stats div{display:flex;justify-content:space-between}.stats b{font-variant-numeric:tabular-nums}
.small{font-size:14px;opacity:.75}
.bar{height:8px;border-radius:4px;background:rgba(30,20,40,.12);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--amber);border-radius:4px;transform-origin:0 50%}
.mdone{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:4px}
.mdone.unseal{font-size:14px;font-weight:800;padding:1px 8px;margin:6px 0 2px;border-radius:10px}.mdone.unseal svg{width:20px;height:20px;flex:none}
.chk{width:18px;height:18px;border-radius:9px;background:var(--mint);position:relative;flex:none}
.chk::after{content:'';position:absolute;left:6px;top:3px;width:4px;height:8px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
#rCont{position:relative;overflow:hidden}
#rCont i{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--ember);transform-origin:0 50%}
#rHint{text-align:center;margin-top:8px}
.leaf{display:inline-block;background:var(--mint);border-radius:8px;padding:1px 8px;font-size:13px;margin-left:6px}
/* shop */
#shop{inset:0;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;padding:var(--st) 0 var(--sb)}
.shead{display:flex;align-items:center;gap:10px;padding:0 var(--sr) 0 var(--sl)}
.shead h2{margin:0;flex:1;text-align:left;color:var(--paper)}
.seg{display:flex;margin:14px var(--sr) 0 var(--sl);background:rgba(255,244,224,.12);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:48px;border-radius:12px;background:none;color:var(--paper);font-weight:700}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
#carousel{flex:1;display:flex;align-items:center;gap:16px;padding:0 calc(50vw - min(36vw,150px));scroll-padding:0}
.scard{flex:none;width:72vw;max-width:300px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px;box-sizing:border-box;border-radius:24px;background:var(--paper);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.scard canvas{width:160px;height:160px;border-radius:20px;background:radial-gradient(circle at 50% 45%,#3A2A4A,#1E1428);transition:transform .3s var(--ease)}
.scard canvas.lk{background:radial-gradient(circle at 50% 45%,#FFF4E0,#E2CFAE)}
.scard .small{color:var(--ink)}
.scard .chip{background:var(--paper-2)}
@media (max-height:520px){.scard{padding:10px 14px;gap:6px}.scard canvas{width:100px;height:100px}.seg{margin-top:6px}}
@media (max-height:600px) and (orientation:portrait){.scard{padding:12px 14px;gap:6px}.scard canvas{width:96px;height:96px}}
@media (max-height:360px){.seg{margin-top:2px;padding:2px}.shead h2{font-size:24px}} /* Safari landscape with the tab bar (852x342) */
@media (max-height:520px) and (orientation:landscape){.seg{position:absolute;top:var(--st);left:calc(var(--sl) + 120px);right:calc(var(--sr) + 200px);margin:0;padding:0;background:#2C2236}} /* landscape: the tabs share the header row */
/* flyers: a vertical grid of tier sections (4 tiles a row; landscape: two tiers a band, 8 columns) */
#flyGrid{position:relative;flex:1;min-height:0;box-sizing:border-box;width:100%;max-width:calc(min(100vw,480px));margin:0 auto;padding:6px var(--sr) 12px var(--sl)}
.fcount{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin:4px 0 2px}
.tiers{display:grid;grid-template-columns:1fr;row-gap:10px}
.tier{--tc:#F3E3C7;min-width:0}
.th{display:flex;align-items:center;gap:8px;height:28px;border-bottom:2px solid var(--tc);position:relative;overflow:hidden}
.th svg{width:20px;height:20px;flex:none}
.th .tn{font-size:13px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.th .to{margin-left:auto;font-size:13px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.th .op{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tc);border:1.5px solid var(--tc);border-radius:6px;padding:0 6px;line-height:18px;transform:rotate(-3deg);margin-right:3px}
.tier.shine .th::after{content:'';position:absolute;left:-40%;bottom:-2px;width:40%;height:4px;background:linear-gradient(90deg,transparent,#FFF4E0,transparent);animation:shine .6s ease-out 1 forwards}
@keyframes shine{to{left:110%}}
.sealBtn{display:flex;align-items:center;gap:6px;width:100%;min-height:48px;margin-top:4px;padding:0 10px;border-radius:12px;background:rgba(255,244,224,.08);color:var(--paper);font-size:13px;font-weight:700;text-align:left}
.sealBtn svg{width:16px;height:16px;flex:none;color:var(--tc)}.sealBtn span{flex:1;min-width:0}
.sealBtn svg:last-child{transition:transform .18s var(--ease)}.sealBtn[aria-expanded=true] svg:last-child{transform:rotate(90deg)}
.sealCard{margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--paper);color:var(--ink)}
.ur{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-top:6px}.ur:first-child{margin-top:0}.ur b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ur+.bar,.sealCard .bar{height:5px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:48px;min-height:100px;padding:6px 0;box-sizing:border-box;border-radius:16px;
 background:radial-gradient(circle at 50% 40%,#3A2A4A,#1E1428);color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.35);overflow:hidden}
.tile canvas{width:64px;height:64px;flex:none}
.tile .nm{font-size:13px;font-weight:700;line-height:17px;letter-spacing:-.02em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .st{font-size:13px;font-weight:700;line-height:17px;min-height:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.eq{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 2px #FFE08A}
.tile.eq::before{content:'';position:absolute;right:0;top:0;width:22px;height:22px;background:#FFE08A;border-radius:0 16px 0 10px}
.tile.eq::after{content:'';position:absolute;right:6px;top:4px;width:5px;height:9px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tile.buy,.tile.save,.tile.seal{background:radial-gradient(circle at 50% 40%,#FFF4E0,#E2CFAE);color:var(--ink)}
.tile.buy canvas,.tile.save canvas{background:radial-gradient(circle at 50% 45%,#3A2A4A,#1E1428 72%);border-radius:14px} /* a dark window: the halo and light art read as in play */
.tile.buy .st{color:#A8501A}.tile.save canvas{opacity:.8}.tile.save .st{opacity:.6}
.tile.buy::before{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 2px #FFB347,inset 0 0 14px rgba(255,179,71,.7);opacity:0;animation:tpulse 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes tpulse{to{opacity:1}}
.tile .new{position:absolute;left:5px;top:5px;padding:0 4px;border-radius:6px;background:var(--ember);color:#fff;font-size:13px;font-weight:800;line-height:16px}
.tile .pb{position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px;background:rgba(30,20,40,.15);overflow:hidden}

.tile.seal .st{opacity:.75}.tile .st svg{width:12px;height:12px;margin-right:3px;vertical-align:-1px}
.tile.bought canvas{animation:stamp .4s var(--ease)}
.tile.bought::after{content:'';position:absolute;left:50%;top:38px;width:20px;height:20px;margin:-10px;border-radius:50%;background:var(--gc,#FFE08A);opacity:0;animation:burst .5s ease-out 1}

.tile.reveal canvas{animation:reveal .6s ease-out 1}

/* detail sheet (portrait: bottom sheet <= 70%; landscape: 320 px right panel) */
#fdWrap{position:absolute;inset:0;z-index:2}
#fdWrap .scrim{transition:opacity .28s;opacity:0}#fdWrap.open .scrim{opacity:1}
#fd{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:70%;box-sizing:border-box;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;
 padding:8px var(--sr) var(--sb) var(--sl);box-shadow:0 -4px 0 rgba(30,20,40,.2);transform:translateY(100%);transition:transform .28s cubic-bezier(.33,1,.68,1)}
#fdWrap.open #fd{transform:none}
.fdTop{display:flex;align-items:center;gap:4px}
.fdTop .xbtn{flex:none;background:var(--paper-2)}.fdTop .xbtn svg{width:22px;height:22px}
.fdT{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.fdT .cap{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}.fdT svg{width:20px;height:20px;flex:none}
.fdT .small{font-size:13px}
.fdStage{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}
#fdCv{width:200px;height:200px;border-radius:20px;background:#1E1428}
.fdSky{display:flex;gap:6px;justify-content:center}
.fdSky button{width:48px;height:48px;border-radius:24px;padding:0;box-shadow:inset 0 0 0 2px rgba(30,20,40,.25)}
.fdSky button[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--ink),0 0 0 2px #FFE08A}
@media (max-width:359px){.fdT .tw{display:none}}
#fdName{font-size:22px;font-weight:800;margin-top:6px;text-align:center}
#fdConcept{font-size:15px;line-height:1.3;text-align:center;opacity:.85}
.lad{display:flex;justify-content:center;align-items:center;gap:6px;margin:10px 0 2px}
.lad span{display:flex;align-items:center;gap:2px}
.lad i{width:7px;height:12px;border-radius:2px;background:rgba(30,20,40,.14)}
.lad i.on{background:var(--tc);box-shadow:inset 0 0 0 1px rgba(30,20,40,.3)}.lad i.me{width:10px;height:18px;box-shadow:0 0 0 1.5px var(--ink)}
.lad span:first-child i.on{background:#CDB892}
.lad i.p6.on{background:linear-gradient(180deg,#9BE7FF,#FF9BC8,#FFE08A,#7FE0B5)}
.trs{margin-top:6px}
.trow{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.trow .g{width:32px;height:32px;border-radius:16px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.trow .g svg{width:20px;height:20px}
.trow b{display:block;font-size:15px;font-weight:800}.trow span{display:block;font-size:14px;font-weight:600;line-height:1.3;opacity:.85}
.fbars{display:flex;gap:10px;margin-top:10px}
.fbars div{flex:1;font-size:13px;font-weight:700;opacity:.8}.fbars b{display:block;height:6px;border-radius:3px;background:rgba(30,20,40,.12);margin-top:3px;overflow:hidden}
.fbars b i{display:block;height:100%;border-radius:3px;background:var(--ink);transform-origin:0 50%}
#fdUnlock{margin-top:10px}
#fdUnlock .uh{font-size:14px;font-weight:800;margin-bottom:4px}
#fdUnlock .pr{font-size:14px;font-weight:700;opacity:.5;text-align:center;margin-top:6px}
.fdFoot{position:sticky;bottom:calc(-1 * var(--sb));z-index:1;background:var(--paper);margin:10px calc(-1 * var(--sr)) calc(-1 * var(--sb)) calc(-1 * var(--sl));padding:8px var(--sr) var(--sb) var(--sl);box-shadow:0 -10px 12px -6px rgba(30,20,40,.12)}
#fdAct{width:100%}
#fdAct.poor,#fdAct:disabled{opacity:.6}
#fdAct.eq{background:var(--mint)}
@media (max-height:520px){
 #flyGrid{max-width:none}

 #fd{left:auto;top:0;width:320px;max-width:none;max-height:none;border-radius:24px 0 0 24px;padding:8px var(--sr) 12px 16px;transform:translateX(100%)}
 #fdCv{width:140px;height:140px}.fdT .tw{display:none}
 .fdFoot{bottom:-12px;margin-bottom:-12px;padding-bottom:12px;margin-left:-16px;padding-left:16px}}
@media (max-height:600px) and (orientation:portrait){#fdCv{width:150px;height:150px}}
.scard .chip.primary{background:var(--amber)}
.scard.cen canvas{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
.scard .nm{font-size:20px;font-weight:800}
.scard button{min-width:150px}
.scard button.poor{opacity:.5}
.scard button.eq{background:var(--mint)}
.stamp{animation:stamp .4s var(--ease)}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
/* misc */
#settings .card,#missions .card,#pause .card{max-height:calc(100% - 8px)}
.slist{font-size:15px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.danger{background:var(--paper-2)}.danger.armed{background:var(--thorn);color:#fff}
.mrow{padding:10px 0;border-bottom:1px solid rgba(30,20,40,.1)}.mrow:last-child{border:0}
.mrow .t{display:flex;justify-content:space-between;gap:8px}
.mrow .rw{display:inline-flex;align-items:center;gap:3px;font-weight:800}
#toast{position:fixed;left:0;right:0;top:calc(var(--st) + 146px);z-index:4;display:flex;justify-content:center;pointer-events:none}
#toast{padding:0 var(--sr) 0 var(--sl)}#toast .pill{max-width:100%;box-sizing:border-box;text-align:center;font-size:15px;line-height:20px;height:auto;min-height:36px;padding:6px 14px;transform:translateY(-12px);opacity:0;transition:transform .24s var(--ease),opacity .24s}
#toast.on .pill{transform:none;opacity:1}
#toast.inshop{top:calc(var(--st) + 60px)}@media (max-height:360px){#toast.inshop{top:calc(var(--st) + 52px)}} /* in the shop: over the Flyers / Trails switch, clear of the tiles */
#crash{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:var(--scrim);padding:24px}
#crash.on{display:flex}
#crash .card{text-align:center;max-width:320px}
#crashMsg{font-size:13px;opacity:.6;margin-top:8px;word-break:break-word}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (prefers-reduced-motion:reduce){ .panel,.panel.open{transform:none!important;transition:opacity .2s} #results .sheet{transition:none;transform:none} .scard.cen canvas{animation:none} }
body.rm .panel,body.rm .panel.open{transform:none!important}

  step(n = 1) { Game.manual = true; n = Math.max(0, n | 0); const FX = Renderer.FX; for (let i = 0; i < n; i++) { FX.clock += CONST.STEP; Input.tickTime = Infinity; Game.tick(); Renderer.syncSlow(FX.clock); Renderer.wallTick(CONST.STEP); }
    const now = performance.now(); if (now - API._lastDraw > 16) { API._lastDraw = now; try { Renderer.dtw = CONST.STEP; Renderer.draw(1); UI.update(CONST.STEP * n); } catch (e) { Loop.onError(e); } } return snapshot(); }, _lastDraw: 0,
  setManualClock(on) { Game.manual = !!on; Loop.resetClock(); },
  setGodMode(on) { Game.god = !!on; },
  givePowerup(kind, seconds) { if (PUPS.indexOf(kind) < 0) return false; Game.givePowerup(kind, seconds); return true; },
  setMeter(v) { Game.setMeter(v); },
  addMotes(n) { Save.d.motes = Math.max(0, Save.d.motes + (n | 0)); Save.write(); },
  previewGates(seed, count, opts) {
    opts = opts || {}; const mode = opts.mode || 'normal', di = Game.dailyInfo(), gs = GenState((seed === undefined ? 1 : seed) >>> 0, makeMods(mode, opts.mod !== undefined ? opts.mod : di.mod), opts.startGate | 0), out = [];
    for (let i = 0; i < (count || 0); i++) { const g = {}, picks = []; genGate(gs, g, (kind, dx, dy, follow, power) => picks.push({ kind: kind === 0 ? 'mote' : kind === 1 ? 'gem' : 'orb', dx, dy, power: kind === 2 ? PUPS[power] : undefined }));
      out.push({ i: g.k, kind: KINDS[g.kind], X: g.X, c: g.c, G: g.G, D: g.D, amp: g.amp, period: g.period, phase: g.phase, v: g.vPrev, rest: g.rest, onboarding: g.onb, lo: g.lo, hi: g.hi, cap: g.cap, pinH: g.pinH, pickups: picks }); }
    return out;
  },
  setSetting(key, value) { UI.setSetting(key, value); return Save.clone(Save.d.settings); },
  setQuality(l) { if (l === 'auto') { Quality.auto = true; } else { Quality.auto = false; Quality.set(l | 0); } },
  getSave: () => Save.clone(Save.d),
  resetSave() { Save.reset(); UI.applySettings(); UI.refreshTitle(); return Save.clone(Save.d); },
  // deep-merge a partial save, then validate and write it (seal and migration fixtures); seals are evaluated live, toasts at finalize / load
  patchSave(p) { Save.patch(p); UI.applySettings(); UI.refreshTitle(); return Save.clone(Save.d); },
  buy(id) { return Unlocks.buy(id); }, // the same gate as the shop: open tier, affordable, not owned
  equip(id) { const ok = Unlocks.equip(id); if (ok) UI.refreshTitle(); return ok; },
  spawnLog: () => World.log ? JSON.parse(JSON.stringify(World.log)) : null, // ?test: every gate's spawn record (k, kind, X, c, pickups)
  showHitboxes(on) { Renderer.debugHit = !!on; },
  // extras for tooling
  injectError(where) { if (where === 'draw') { const d = Renderer.draw; Renderer.draw = function () { Renderer.draw = d; throw new Error('injected draw error'); }; } },
  audioVoices: () => Audio.active(), haptics: Haptics
};
function boot() {
  try { rng.fx.seed((Date.now() ^ (performance.now() * 1000)) >>> 0); } catch (e) { }
  Save.load(); if (FLAGS.test) Quality.auto = false;
  Input.init(); View.init(); View.measure();
  Art.init(View.K); Particles.resize(); Particles.ambInit();
  try { $('vigFx').getContext('2d').drawImage(Art.slowVig.c, 0, 0); } catch (e) { }
  wireFX(); Game.wireMissions(); UI.init(); UI.bootToasts();
  const hide = () => { Input.releaseAll(); if (Game.pause()) { } Audio.suspend(); Save.write(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') hide(); else { Loop.resetClock(); Quality.remeasure(); Audio.resyncClock(); } });
  window.addEventListener('pagehide', hide); window.addEventListener('blur', hide);
  window.addEventListener('focus', () => Loop.resetClock());
  Game.go('title');
  window.__GAME = API; window.__softReset = Loop.softReset; if (FLAGS.debug) window.__ART = Art;
  if (FLAGS.daily) Game.toReady({ mode: 'daily' });
  Loop.start(); window.__booted = true;
}
try { boot(); } catch (e) { window.__errs.push('boot: ' + String(e && e.stack || e)); window.__showCrash(e && e.message); }
