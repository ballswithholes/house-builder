<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>各文化城池模型 测试</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1c22; color: #f5eddb; overflow: hidden;
    font: 13px/1.4 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif,"WenQuanYi Zen Hei"; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 8px; top: 6px; right: 8px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: #f3c969; }
  #bar { pointer-events: auto; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  #bar button { background: rgba(30,28,38,.85); color: #f5eddb; border: 1px solid #4a4555; border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #bar button.on { background: #7a3a24; border-color: #c8703a; }
  #stat { color: #d8d0c0; font-size: 12px; }
  .lab { position: fixed; transform: translate(-50%, -100%); font-size: 11px; white-space: nowrap; pointer-events: none;
    background: rgba(10,10,14,.62); padding: 1px 5px; border-radius: 4px; }
  .lab i { color: #f3c969; font-style: normal; }
  body.shot #hud, body.shot .lab.small { display: none; }
  body.nolab .lab { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><b>各文化城池模型</b>（js/culture-art.js · 第四版低多边形）每格：普通 · 大城 · 都城（远景模型在下排）；拖动旋转，滚轮缩放
  <div id="bar"></div>
  <div id="stat">…</div></div>
<script src="../vendor/three.min.js"></script>
<script src="../js/core.js"></script>
<script src="../js/lowpoly.js"></script>
<script src="../js/lp-props.js"></script>
<script src="../js/art.js"></script>
<script src="../js/culture-art.js"></script>
<script>
'use strict';
/* URL 参数
     only=han,roman,africa:meroe   只画这些条目（「文化:城键」可选特定城，如 africa:meroe = 库施式，sarmatian:panticapaeum，
                                   persia:ctesiphon = 泰西封大拱；其余波斯都城为台上伊万宫殿）
     tiers=0,1,2                   档次（0 普通、1 大城、2 都城），缺省全部
     lod=near | far | both         近景 / 远景 / 两排（缺省 both）
     mood=noon | morning | golden | dusk | night   时间氛围（缺省 noon）
     cols=3                        每行格数；size=1.2 城的尺寸（地图上 0.9–1.5）
     view=fit | map | close        相机：全部、地图视角（约同游戏中层镜头）、近看第一座；yaw / pitch / dist / focus=第 n 格
     shot=1                        截图模式（隐藏界面）；nolab=1 不画标签
     scatter=1                     用 SG.CultureArt.scatter 实例化（战略地图的接法：同模型实例化 + 墨线实例化 + 远近景按块切换 + 灯位）
     inkDist=45                    （scatter）墨线距离带：更远的近景不描墨线（0 = 一律描）；noink=1（逐个模型时）不画墨线
     midDist=45                    （scatter）中景距离：更远的区块用中景模型（去掉垛口、墙缝、灯笼、屋脊饰；缺省 = inkDist，0 = 不用）
     lod=mid                       （逐个模型时）画中景模型
     nolamps=1                     不给氛围加灯池（看没分到真灯池的城夜里靠自身的窗光 / 地面灯池是什么样子）
     perf=200                      性能模式：200 座随机文化 / 档次的城排成网格（间距 spacing=5），配合 scatter=1 比较绘制次数与帧时 */
(function () {
  if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;
  const SG = window.SG, LP = SG.LP, CA = SG.CultureArt;
  const Q = new URLSearchParams(location.search);
  const qv = (k, d) => (Q.has(k) ? Q.get(k) : d);
  if (Q.has('shot')) document.body.classList.add('shot');
  if (Q.has('nolab')) document.body.classList.add('nolab');
  const size = +qv('size', 1.2), MOOD = qv('mood', 'noon'), LOD = qv('lod', 'both'), COLS = +qv('cols', 3);
  const tiers = qv('tiers', '0,1,2').split(',').map(Number);
  const SCATTER = Q.has('scatter'), PERF = +qv('perf', 0);
  const allEntries = ['han'].concat(CA.cultures, ['africa:meroe', 'sarmatian:panticapaeum', 'persia:ctesiphon']);
  const list = Q.has('only') ? Q.get('only').split(',') : allEntries;
  const cv = document.getElementById('cv');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = !Q.has('noshadow');
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  LP.setOutputEncoded(true);
  const scene = new THREE.Scene();
  const fogBase = [0.78, 0.85, 0.92];
  scene.background = new THREE.Color(...fogBase);
  const SP = +qv('spacing', 5), PC = Math.ceil(Math.sqrt(PERF || 1));
  const cellW = PERF ? SP : 3 * 3.3 * size, cellH = PERF ? SP : (LOD === 'both' && !SCATTER ? 2 : 1) * 3.3 * size + 1.4 * size;
  const rows = PERF ? PC : Math.ceil(list.length / COLS);
  const W = (PERF ? PC : COLS) * cellW, D = rows * cellH;
  scene.fog = new THREE.Fog(scene.background, Math.max(W, D) * 1.2, Math.max(W, D) * 3);
  const mood = new LP.Mood(scene, { center: [0, 0, 0], extent: Math.max(W, D) * 0.62, shadowSize: 4096, fog: { base: fogBase }, maxLamps: 8 });
  // 地面：草地（不描墨线），格下一块浅土色
  {
    const M = new LP.MeshBuilder(5);
    const gx = W / 2 + 6, gz = D / 2 + 6;
    M.quad([-gx, 0, -gz], [gx, 0, -gz], [gx, 0, gz], [-gx, 0, gz], [0, 1, 0], [0.55, 0.64, 0.36]);
    scene.add(LP.mesh(M.toGeometry(), { outline: false, castShadow: false }));
  }
  const labels = [], objs = [], cities = [], items = [];
  let tris = 0, maxTris = 0, maxName = '', farMax = 0, farName = '', ms = 0;
  const TIER = ['', '大', '都'];
  if (PERF) {
    // 性能模式：随机文化 / 档次的城排成网格
    let s = 12345; const rnd = () => ((s = (s * 1103515245 + 12345) >>> 0) / 4294967296);
    for (let i = 0; i < PERF; i++) {
      const entry = allEntries[Math.floor(rnd() * allEntries.length)], cult = entry.split(':')[0], key = entry.split(':')[1] || ('c' + i);
      const tier = rnd() < 0.08 ? 2 : rnd() < 0.3 ? 1 : 0, sz = tier === 2 ? 1.45 : tier === 1 ? 1.3 : 0.9 + rnd() * 0.3;
      const x = (i % PC - (PC - 1) / 2) * SP, z = (Math.floor(i / PC) - (PC - 1) / 2) * SP, city = { key, town: tier ? 480 : 260, culture: cult };
      const t0 = performance.now();
      if (SCATTER) items.push({ x, y: 0, z, yaw: (i * 37 % 20 - 10) * Math.PI / 180, size: sz, culture: cult, capital: tier === 2, city });
      else { const obj = CA.object(sz, cult, tier === 2, city, {}); obj.position.set(x, 0, z); obj.rotation.y = (i * 37 % 20 - 10) * Math.PI / 180; scene.add(obj); objs.push(obj); tris += obj.userData.tris; }
      ms += performance.now() - t0;
    }
  }
  if (!PERF) list.forEach((entry, i) => {
    const cult = entry.split(':')[0], key = entry.split(':')[1] || '';
    const col = i % COLS, row = Math.floor(i / COLS);
    const cx = (col - (COLS - 1) / 2) * cellW, cz = (row - (rows - 1) / 2) * cellH;
    const lods = SCATTER ? ['near'] : LOD === 'both' ? ['near', 'far'] : [LOD];
    tiers.forEach((tier, ti) => {
      const cap = tier === 2, sz = tier === 1 ? Math.max(size, 1.3) : tier === 2 ? Math.max(size, 1.45) : Math.min(size, 1.15);
      const city = { key, town: tier === 1 ? 480 : tier === 2 ? 560 : 260, culture: cult };
      lods.forEach((lod, li) => {
        const t0 = performance.now();
        const obj = CA.object(sz, cult, cap, city, { lod });
        ms += performance.now() - t0;
        const x = cx + (ti - (tiers.length - 1) / 2) * 3.3 * size, z = cz + (li - (lods.length - 1) / 2) * 3.3 * size;
        obj.position.set(x, 0, z);
        if (SCATTER) items.push({ x, y: 0, z, yaw: 0, size: sz, culture: cult, capital: cap, city });
        else {
          scene.add(obj);
          obj.updateMatrixWorld(true);
          if (!Q.has('nolamps')) SG.LPProps.addLamps(obj, mood);
        }
        objs.push(obj);
        // 旗帜位置（map-view：本地 Unity (0.9s, 0, 0.9s) → three (0.9s, 0, −0.9s)）
        const pole = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.2, 0.06), new THREE.MeshBasicMaterial({ color: 0x6a5030 }));
        pole.position.set(x + sz * 0.9, 1.1, z - sz * 0.9);
        scene.add(pole);
        const nt = obj.userData.tris;
        tris += nt;
        if (lod === 'near' && nt > maxTris) { maxTris = nt; maxName = entry + TIER[tier]; }
        if (lod === 'far' && nt > farMax) { farMax = nt; farName = entry + TIER[tier]; }
        cities.push({ entry, tier, lod, tris: nt, key: obj.name, h: obj.userData.lp.size[1] / sz, x, z, sz });
        const el = document.createElement('div');
        el.className = 'lab' + (lod === 'far' ? ' small' : '');
        el.innerHTML = (TIER[tier] ? '<i>' + TIER[tier] + '</i> ' : '') + (lod === 'far' ? '远 ' : entry + ' ') + '<span style="color:#c8c0b0">' + nt + '△</span>';
        document.body.appendChild(el);
        labels.push({ el, pos: new THREE.Vector3(x, sz * 1.6 + 0.6, z) });
      });
    });
  });
  if (Q.has('noink')) for (const o of objs) o.traverse(m => { if (m.name === 'outline') m.visible = false; });
  let SC = null;
  if (SCATTER) {
    const t0 = performance.now();
    SC = CA.scatter(items, { chunk: +qv('chunk', 30), lodDist: +qv('lodDist', 60), inkDist: +qv('inkDist', 45), midDist: Q.has('midDist') ? +Q.get('midDist') : undefined });
    ms += performance.now() - t0;
    scene.add(SC.group);
    if (!Q.has('nolamps')) for (const l of SC.lamps) mood.addLamp(l.pos, l);
    if (PERF) tris = SC.scatter.stats.copies;
  } else if (PERF && !Q.has('nolamps')) for (const obj of objs) { obj.updateMatrixWorld(true); SG.LPProps.addLamps(obj, mood); }
  const statEl = document.getElementById('stat');
  const statBase = (PERF ? 'perf ' + PERF + (SCATTER ? ' scatter（实例 ' + tris + '）' : ' objects') + ' · ' : '') + '共 ' + objs.length + ' 座，三角形 ' + tris + '（近景最多 ' + maxTris + '：' + maxName + '；远景最多 ' + farMax + '：' + farName + '）· 建模 ' + ms.toFixed(0) + ' ms · ' + MOOD;
  statEl.textContent = statBase;
  window.cityStats = cities;

  const cam = new THREE.PerspectiveCamera(36, 1, 0.05, 600);
  let yaw = +qv('yaw', 0) * Math.PI / 180, pitch = +qv('pitch', 52) * Math.PI / 180;
  let dist = Math.max(W, D) * 0.95 + 4;
  const target = new THREE.Vector3(0, 0, 0);
  const view = qv('view', 'fit');
  const focus = +qv('focus', 0);
  if (view === 'map' || view === 'close') {
    const c = cities.filter(c => c.lod === 'near')[Math.min(focus, cities.length - 1)] || cities[0];
    target.set(c.x, 0.4, c.z);
    dist = view === 'map' ? 13 : 6.5;
    if (!Q.has('pitch')) pitch = (view === 'map' ? 52 : 40) * Math.PI / 180;
  }
  if (Q.has('dist')) dist = +Q.get('dist');
  if (Q.has('tx')) target.x = +Q.get('tx');
  if (Q.has('tz')) target.z = +Q.get('tz');
  function place() {
    cam.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    cam.lookAt(target);
  }
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
    const v = renderer.getDrawingBufferSize(new THREE.Vector2());
    LP.setViewport(v.x, v.y);
  }
  addEventListener('resize', resize); resize();
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drag) return; yaw = drag.yaw - (e.clientX - drag.x) * 0.006; pitch = Math.max(0.12, Math.min(1.5, drag.pitch + (e.clientY - drag.y) * 0.005)); });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => { dist = Math.max(1.5, Math.min(400, dist * (e.deltaY > 0 ? 1.1 : 0.9))); e.preventDefault(); }, { passive: false });
  window.view = (x, z, d, yw, p) => { target.set(x, 0.4, z); dist = d; if (yw !== undefined) yaw = yw; if (p !== undefined) pitch = p; };
  window.setMood = m => { mood.set(m); statEl.textContent = statBase.replace(/· [a-z]+$/, '· ' + m); };
  // 时间按钮
  const bar = document.getElementById('bar');
  for (const m of ['morning', 'noon', 'golden', 'dusk', 'night']) {
    const b = document.createElement('button'); b.textContent = m; if (m === MOOD) b.className = 'on';
    b.onclick = () => { window.setMood(m); for (const x of bar.children) x.className = x === b ? 'on' : ''; };
    bar.appendChild(b);
  }
  mood.set(MOOD);
  const clock = new THREE.Clock();
  let frames = 0, fsum = 0, last = performance.now();
  function frame() {
    place();
    LP.setTime(clock.getElapsedTime());
    if (SC) { scene.updateMatrixWorld(); SC.update(cam); }
    mood.update && mood.update(cam);
    renderer.render(scene, cam);
    const now = performance.now(); if (frames > 2) fsum += now - last; last = now; frames++;
    if (frames === 30) { statEl.textContent += ' · ' + renderer.info.render.calls + ' draws · ' + renderer.info.render.triangles + ' tris drawn · ' + (fsum / 27).toFixed(0) + ' ms/frame'; window.__perf = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, ms: +(fsum / 27).toFixed(1) }; }
    const w = innerWidth, h = innerHeight, v = new THREE.Vector3();
    for (const l of labels) {
      v.copy(l.pos).project(cam);
      const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
      l.el.style.display = vis ? '' : 'none';
      if (vis) { l.el.style.left = ((v.x + 1) / 2 * w) + 'px'; l.el.style.top = ((1 - v.y) / 2 * h) + 'px'; }
    }
    if (frames === 3) window.__done = true;
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
