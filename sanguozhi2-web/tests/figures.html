<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>三国志-霸王的世界 · 人物模型库（SG.Figure）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15141a; color: #eee6d4; font: 13px/1.4 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; background: rgba(12,12,16,.78); z-index: 5; align-items: center; }
  #bar button, #bar select { background: #2a2733; color: #eee6d4; border: 1px solid #4a4555; border-radius: 6px; padding: 5px 9px; font: inherit; min-height: 30px; cursor: pointer; }
  #bar button.on { background: #7a3a24; border-color: #c8703a; }
  #bar .sep { width: 1px; height: 22px; background: #4a4555; margin: 0 4px; }
  #poses { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 3px; padding: 5px 8px; background: rgba(12,12,16,.7); z-index: 5; }
  #poses button { background: #23212b; color: #d8d0bc; border: 1px solid #3a3644; border-radius: 5px; padding: 4px 7px; font: 12px/1 inherit; min-height: 28px; cursor: pointer; }
  #poses button.on { background: #2f5a3a; border-color: #5aa070; }
  #hud { position: fixed; right: 8px; top: 48px; z-index: 5; background: rgba(12,12,16,.72); padding: 8px 10px; border-radius: 8px; white-space: pre; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #cfe8c8; pointer-events: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #labels div { position: absolute; transform: translate(-50%, 0); font-size: 12px; color: #f3e2b8; text-shadow: 0 1px 2px #000, 0 0 6px #000; white-space: nowrap; }
  #hud.min { white-space: nowrap; }
  @media (max-width: 900px) { #bar button, #bar select { padding: 4px 6px; min-height: 30px; font-size: 12px; } #hud { top: auto; bottom: auto; top: 84px; right: 6px; font-size: 10px; padding: 5px 7px; pointer-events: auto; cursor: pointer; } }
  @media (max-height: 460px) { #hud { top: 84px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="bar"></div>
<div id="poses"></div>
<div id="hud">载入中…</div>
<script src="../vendor/three.min.js"></script>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/world-data.js"></script>
<script src="../js/portrait-data.js"></script>
<script src="../js/portrait.js"></script>
<script src="../js/lowpoly.js"></script>
<script src="../js/figure.js"></script>
<script>
'use strict';
(function () {
  // 与游戏相同的 Gamma 工作流
  if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;
  const Q = new URLSearchParams(location.search);
  const qv = (k, d) => (Q.has(k) ? Q.get(k) : d);
  const SHOT = Q.has('shot');
  const state = { mode: qv('mode', 'generals'), pose: qv('pose', 'idle'), t: Q.has('t') ? +Q.get('t') : null, lod: qv('lod', ''), wire: Q.has('wire'), page: +qv('page', 0), yaw: +qv('yaw', 0), name: qv('name', '关羽'), spin: !SHOT && !Q.has('nospin'), anim: !SHOT };
  window.__fig = { ready: false, errors: [], info: {} };
  if (Q.get('ui') === '0') document.head.insertAdjacentHTML('beforeend', '<style>#bar,#poses,#hud,#labels{display:none!important}</style>');
  window.addEventListener('error', e => window.__fig.errors.push(String(e.message)));

  const cv = document.getElementById('cv');
  const dpr = Math.min(window.devicePixelRatio || 1, +qv('dpr', 2));
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(dpr);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // 绘制统计包含阴影贴图那一遍（three 默认在阴影之后才重置 info，会漏掉阴影绘制）
  renderer.info.autoReset = false;
  // 第四版：Lanternvale 风格的 SG.LP 光照（LP.Mood：太阳 / 天光 / 雾 / 夜色调），与 tests/lowpoly.html 的试点同一套布景
  //（?mood=noon | golden | dusk | night，缺省 noon；?bg=dark 换深色背景）
  const LP = SG.LP;
  LP.setOutputEncoded(true);
  const MOODN = qv('mood', 'noon');
  const scene = new THREE.Scene();
  const bgCol = Q.get('bg') === 'dark' ? new THREE.Color(0.2, 0.21, 0.25) : MOODN === 'night' ? new THREE.Color(0.17, 0.2, 0.36) : MOODN === 'golden' ? new THREE.Color(0.93, 0.82, 0.7) : new THREE.Color(0.8, 0.86, 0.92);
  scene.background = bgCol.clone();
  scene.fog = new THREE.Fog(bgCol.clone(), 40, 120);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
  window.__fig.three = { scene, camera, renderer };   // 性能测量用
  const mood = new LP.Mood(scene, { center: [0, 0, -1], extent: 14, shadowSize: 2048 });
  mood.set(MOODN);
  LP.globals.lpFog.value.x = 0.6;
  if (MOODN === 'night') { mood.addLamp([-2.2, 2.2, 1.6], { color: '#ffb35c', intensity: 1.6, range: 9 }); mood.addLamp([2.6, 2.2, 1.2], { color: '#ffb35c', intensity: 1.4, range: 9 }); }
  // 地面：试点的米绿色棋盘格（1 米格，便于比对身高）
  function checkerGround(n) {
    const M = new LP.MeshBuilder(5);
    const a = [0.66, 0.72, 0.55], b = [0.61, 0.67, 0.51], N = n || 24;
    for (let z = -N; z < N; z++) for (let x = -N; x < N; x++) {
      const c = ((x + z) & 1) === 0 ? a : b;
      M.quad([x, 0, z], [x + 1, 0, z], [x + 1, 0, z + 1], [x, 0, z + 1], [0, 1, 0], c);
    }
    const m = LP.mesh(M.toGeometry(), { outline: false, castShadow: false, side: THREE.DoubleSide });
    m.name = 'checker';
    return m;
  }
  const ground = checkerGround(); scene.add(ground);
  // 自动检查用的小场景（同样的 LP 正午光照）
  function lpScene(shadow) {
    const s = new THREE.Scene();
    const md = new LP.Mood(s, { center: [0, 0, 0], extent: 10, shadow: shadow !== false, shadowSize: 1024 });
    md.set('noon');
    return { scene: s, mood: md };
  }

  // 武将数据
  const W = SG.Scenarios && SG.Scenarios.world;
  const GEN = {};
  const facColor = {};
  if (W) {
    for (const l of W.Factions) { const p = l.split('|'); facColor[p[0]] = p[3]; }
    for (const l of W.Generals) { const p = l.split('|'); GEN[p[0]] = { name: p[0], war: +p[1], intel: +p[2], pol: +p[3], culture: p[9] || 'han', color: facColor[p[4]] || '#8a8a8a' }; }
  }
  const gen = n => GEN[n] || { name: n, war: 80, intel: 60, pol: 50 };
  const FAMOUS = ['关羽', '张飞', '吕布', '赵云', '诸葛亮', '曹操', '孙策', '马超', '典韦', '许褚', '黄忠', '夏侯惇', '刘备', '孙权', '周瑜', '太史慈', '祝融', '孟获', '甘宁', '张辽',
    '塞维鲁', '康茂德', '沃洛吉斯', '卑弥呼', '轲比能', '胡维色迦', '范师蔓', '沙伊鲁姆', '阿根托科克斯', '巴洛马尔', '赞提库斯', '故国川王', '安国', '帕佩克',
    // 第三版：天竺（india）、阿克苏姆 / 库施（africa）、巴夸特（moor）
    '耶若室利', '跋婆瞿波', '迦梨迦罗', '内敦切利扬', '室利那伽', '龙树', '加达拉特', '耶斯博赫', '阿曼哈利卡', '马沙达赫尔', '卡纳尔塔', '鲁德拉布提'];
  const FCOL = { '关羽': '#2f7d4a', '张飞': '#2f7d4a', '赵云': '#2f7d4a', '诸葛亮': '#2f7d4a', '刘备': '#2f7d4a', '马超': '#2f7d4a', '黄忠': '#2f7d4a', '曹操': '#2c3d8f', '典韦': '#2c3d8f', '许褚': '#2c3d8f', '夏侯惇': '#2c3d8f', '张辽': '#2c3d8f', '孙策': '#c8382c', '孙权': '#c8382c', '周瑜': '#c8382c', '太史慈': '#c8382c', '甘宁': '#c8382c', '吕布': '#7a2a8a' };

  // ------------------------------------------------------------ 场景内容 --
  let items = [];   // { fig, x, z, label, horse }
  const labels = document.getElementById('labels');
  function clear() {
    for (const it of items) { if (it.fig) it.fig.dispose(); if (it.horse) it.horse.dispose(); if (it.mesh) { scene.remove(it.mesh); it.mesh.geometry.dispose(); } if (it.crowd) it.crowd.dispose(); }
    crowd = null;
    items = []; labels.innerHTML = '';
  }
  function place(obj, x, z, yaw) { obj.position.set(x, 0, z); obj.rotation.y = yaw || 0; scene.add(obj); }
  function label(it, text) { const d = document.createElement('div'); d.textContent = text; labels.appendChild(d); it.label = d; }
  let camTarget = new THREE.Vector3(0, 1, 0), camDist = 6, camYaw = 0, camPitch = 0.12;
  let crowd = null;     // 压力测试：实例化士兵群（?crowd=0 改用逐个 SkinnedMesh）
  function build() {
    clear();
    const t0 = performance.now();
    const m = state.mode;
    if (m === 'generals') {
      // ?names=甲,乙,…：只列这些武将（一行最多 6 人，多出的排到后排）；?shield=1 单手兵器配本文化的盾
      const per = 6, list = Q.has('names') ? Q.get('names').split(',') : FAMOUS.slice(state.page * per, state.page * per + per);
      const rowsN = Math.ceil(list.length / per);
      list.forEach((n, i) => {
        const f = SG.Figure.general(gen(n), { lod: state.lod || 'high', color: FCOL[n] || gen(n).color, shield: Q.has('shield') ? true : undefined });
        const inRow = Math.min(per, list.length - Math.floor(i / per) * per);
        const x = ((i % per) - (inRow - 1) / 2) * 1.35, z = -Math.floor(i / per) * 2.2;
        place(f.root, x, z, 0);
        const it = { fig: f, x, z }; label(it, n + ' · ' + (f.weaponInfo ? f.weaponInfo.name : '') + (Q.has('tris') ? ' · ' + f.triangles : '')); items.push(it);
      });
      camTarget.set(0, 1.05, -(rowsN - 1) * 1.1); camDist = 7.4 + (rowsN - 1) * 3.2; camPitch = 0.08 + (rowsN - 1) * 0.1;
    } else if (m === 'one') {
      const f = SG.Figure.general(gen(state.name), { lod: state.lod || 'high', color: FCOL[state.name] || gen(state.name).color });
      place(f.root, 0, 0, 0);
      const it = { fig: f, x: 0, z: 0 }; label(it, state.name + ' · ' + f.weaponInfo.name + ' · ' + f.triangles + ' 三角形'); items.push(it);
      camTarget.set(0, +qv('ty', 1.15), 0); camDist = +qv('dist', 3.6); camPitch = +qv('pitch', 0.06);
    } else if (m === 'poses') {
      const names = Q.has('clips') ? Q.get('clips').split(',') : Object.keys(SG.Figure.clips);
      const cols = Math.min(+qv('cols', 7), names.length), sp = +qv('sp', 2.1);
      const rows = Math.ceil(names.length / cols);
      names.forEach((cn, i) => {
        const f = SG.Figure.general(gen(state.name), { lod: state.lod || 'mid', color: FCOL[state.name] });
        const x = ((i % cols) - (cols - 1) / 2) * sp, z = -Math.floor(i / cols) * 2.6;
        place(f.root, x, z, +qv('fy', 0) * Math.PI / 180);
        const it = { fig: f, x, z, clip: cn, ly: 0.05 };
        if (Q.has('ts')) it.tf = +Q.get('ts').split(',')[i];
        label(it, cn + (it.tf != null ? ' @' + it.tf : '')); items.push(it);
      });
      camTarget.set(0, 0.95, -(rows - 1) * 1.3); camDist = 2.5 + cols * sp * 0.75 + rows * 1.5; camPitch = 0.12 + rows * 0.06;
    } else if (m === 'soldiers') {
      const cults = Q.has('cults') ? Q.get('cults').split(',') : SG.Figure.cultures, types = SG.Figure.soldierTypes;
      const lod = state.lod || 'low';
      const cols = ['#b02a24', '#2c3d8f', '#2f7d4a', '#c89a2a', '#6a2a8a'];
      cults.forEach((c, ci) => types.forEach((ty, ti) => {
        const f = SG.Figure.soldier({ type: ty, culture: c, lod, seed: ci + ti, color: cols[ci % cols.length] });
        const nrow = Math.min(5, cults.length);
        const x = (ti - 1.5) * 0.9 + ((ci % 5) - (nrow - 1) / 2) * 4.2, z = -Math.floor(ci / 5) * 2.6;
        place(f.root, x, z, 0);
        const it = { fig: f, x, z }; if (ti === 0) label(it, c); items.push(it);
      }));
      // 只列少数文化（?cults=）时镜头拉近、居中；?dist= 可调
      const rowsS = Math.ceil(cults.length / 5), nS = Math.min(5, cults.length);
      camTarget.set(0, 0.8, -(rowsS - 1) * 1.3); camDist = +qv('dist', rowsS > 1 ? 21 : 4.5 + nS * 3.3); camPitch = rowsS > 1 ? 0.2 : 0.1;
    } else if (m === 'horses') {
      // ?riders=甲,乙,…：换骑手（检查长袍骑乘时的腿）
      const riders = Q.has('riders') ? Q.get('riders').split(',') : ['吕布', '关羽', '马超', '赞提库斯'];
      riders.forEach((n, i) => {
        const h = SG.Figure.horse({ lod: state.lod || 'mid', seed: i, color: FCOL[n] || gen(n).color, name: n === '吕布' ? '赤兔' : null, armor: n === '赞提库斯' ? 'scale' : 'cloth', general: true });
        const f = SG.Figure.general(gen(n), { lod: state.lod || 'mid', color: FCOL[n] || gen(n).color });
        h.mount(f);
        const x = (i - (riders.length - 1) / 2) * 2.2;
        place(h.root, x, 0, 0.6);
        const it = { fig: f, horse: h, x, z: 0 }; label(it, n); items.push(it);
      });
      camTarget.set(0, 1.4, 0); camDist = 11; camPitch = 0.12;
    } else if (m === 'weapons') {
      const ws = SG.Figure.weapons;
      const poles = ws.filter(w => w.style === 'pole'), short = ws.filter(w => w.style !== 'pole');
      const lay = (list, z, y0, sp) => list.forEach((wd, i) => {
        const w = SG.Figure.weapon(wd.id, { lod: 'high' });
        const x = (i - (list.length - 1) / 2) * sp;
        w.position.set(x, y0, z); w.rotation.y = Math.PI / 2;
        scene.add(w);
        const it = { mesh: w, x, z, spinMesh: true, ly: y0 - 0.25 }; label(it, wd.name); items.push(it);
      });
      lay(poles, -1.2, 1.05, 0.62);
      lay(short, 0.6, 0.55, 0.44);
      camTarget.set(0, 1.0, -0.4); camDist = 9; camPitch = 0.05;
    } else if (m === 'crowd') {
      // 实例化士兵群：每种文化一排（枪、刀盾、弓、骑），片段取 pose（骑兵：idle / walk / trot / gallop / attack / charge / hit / die）
      const cults = Q.has('cults') ? Q.get('cults').split(',') : ['han', 'roman', 'persia', 'steppe', 'wa'];
      crowd = SG.Figure.crowd({ lod: state.lod || 'low', renderer }); scene.add(crowd.root); items.push({ crowd });
      const cols = ['#b02a24', '#2c3d8f', '#2f7d4a', '#c89a2a', '#6a2a8a'];
      const mclip = { idle: 'idle', walk: 'walk', run: 'gallop', light1: 'attack', light2: 'attack', heavy: 'attack', hit: 'hit', die: 'die', down: 'die' }[state.pose] || state.pose;
      cults.forEach((c, ci) => ['spear', 'sword', 'archer', 'cavalry'].forEach((ty, ti) => {
        const mounted = ty === 'cavalry';
        const id = crowd.add({ type: ty, culture: c, seed: ci, color: cols[ci % cols.length], mounted });
        const x = (ti - 1.5) * 1.3, z = -ci * 2.4;
        crowd.setTransform(id, x, 0, z, mounted ? -0.5 : 0);
        crowd.play(id, mounted ? mclip : (ty === 'archer' && state.pose === 'light1' ? 'bowDraw' : state.pose), { t0: 0 });
        const it = { x, z, ly: mounted ? 2.6 : 2.0 }; if (ti === 0) label(it, c); items.push(it);
      }));
      camTarget.set(0, 1.0, -(cults.length - 1) * 1.2); camDist = 7 + cults.length * 2.2; camPitch = 0.22;
    } else if (m === 'check') {
      runChecks();
    } else if (m === 'stress') {
      const L = [], R = [];
      const g1 = SG.Figure.general(gen('关羽'), { lod: 'mid', color: '#2f7d4a' }), g2 = SG.Figure.general(gen('张辽'), { lod: 'mid', color: '#2c3d8f' });
      const h1 = SG.Figure.horse({ lod: 'mid', color: '#2f7d4a', seed: 1, general: true }), h2 = SG.Figure.horse({ lod: 'mid', color: '#2c3d8f', seed: 2, general: true });
      h1.mount(g1); h2.mount(g2);
      place(h1.root, -3.2, 0, Math.PI / 2); place(h2.root, 3.2, 0, -Math.PI / 2);
      items.push({ fig: g1, horse: h1, x: -3.2, z: 0, clip: 'idle' }, { fig: g2, horse: h2, x: 3.2, z: 0, clip: 'idle' });
      const useCrowd = qv('crowd', '1') !== '0';
      if (useCrowd) { crowd = SG.Figure.crowd({ lod: 'low', renderer }); scene.add(crowd.root); items.push({ crowd }); }
      for (let side = 0; side < 2; side++) for (let i = 0; i < 28; i++) {
        const ty = i < 4 ? 'cavalry' : i < 12 ? 'archer' : i < 20 ? 'spear' : 'sword';
        if (crowd) {
          const row = Math.floor(i / 7), colm = i % 7;
          const x = (side ? 1 : -1) * (1.2 + row * 0.9), z = (colm - 3) * 0.85;
          const mounted = ty === 'cavalry' && i < 2;
          const id = crowd.add({ type: ty, culture: qv('cult', 'han'), seed: i, color: side ? '#2c3d8f' : '#2f7d4a', mounted });
          crowd.setTransform(id, x, 0, z, side ? -Math.PI / 2 : Math.PI / 2);
          crowd.play(id, mounted ? 'gallop' : ['idle', 'walk', 'light1', 'run', 'block', 'hit', 'heavy'][i % 7], { phase: (i * 0.37) % 1 });
          continue;
        }
        const f = SG.Figure.soldier({ type: ty, culture: 'han', lod: 'low', seed: i, color: side ? '#2c3d8f' : '#2f7d4a' });
        const row = Math.floor(i / 7), colm = i % 7;
        const x = (side ? 1 : -1) * (1.2 + row * 0.9), z = (colm - 3) * 0.85;
        place(f.root, x, z, side ? -Math.PI / 2 : Math.PI / 2);
        const it = { fig: f, x, z, clip: ['idle', 'walk', 'light1', 'run', 'block', 'hit', 'heavy'][i % 7], ph: i * 0.37 };
        if (ty === 'cavalry' && i < 2) { const h = SG.Figure.horse({ lod: 'low', color: side ? '#2c3d8f' : '#2f7d4a', seed: i }); h.mount(f); place(h.root, x, z, side ? -Math.PI / 2 : Math.PI / 2); f.root.position.set(0, -f.pr.J.pelvis[1] + 0.08, -0.04); f.root.rotation.set(0, 0, 0); it.horse = h; it.clip = 'gallop'; }
        items.push(it);
      }
      camTarget.set(0, 0.6, 0); camDist = 15; camPitch = 0.42;
    }
    if (Q.has('dist')) camDist = +Q.get('dist');
    if (Q.has('pitch')) camPitch = +Q.get('pitch');
    camYaw = state.yaw * Math.PI / 180;
    window.__fig.info.buildMs = Math.round(performance.now() - t0);
    applyWire();
    poseAll(0);
    renderPoseButtons();
  }
  // ------------------------------------------------------------ 自动检查（?mode=check）--
  // 倒地 / 跪地片段不穿地、双手长兵左手在杆上、三角形预算（第四版：high 3.1k / 名将 3.6k / mid 1.8k / 士兵 900 / 战马）、裸身肤色与面部一致、士兵群绘制次数（含阴影、墨线）
  function runChecks() {
    const R = [], ok = (name, pass, info) => R.push({ name, pass, info });
    const v = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3(), g = new THREE.Vector3(), ab = new THREE.Vector3(), ag = new THREE.Vector3();
    const names = (Q.get('names') || '关羽,吕布,赵云,张飞,许褚,孙权,刘备,诸葛亮,黄忠,典韦,卑弥呼,康茂德').split(',');
    let rigidMin = 0, skinMin = 0, gripMax = 0, worst = '', worstG = '';
    for (const n of names) {
      const f = SG.Figure.general(gen(n), { lod: 'high' });
      for (const clip of Object.keys(SG.Figure.clips)) {
        const info = SG.Figure.clips[clip];
        for (const fr of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
          f.setPose(clip, fr * info.dur); f.root.updateMatrixWorld(true);
          for (const m of f.meshes) {
            const pos = m.geometry.attributes.position;
            for (let i = 0; i < pos.count; i += 3) {
              if (m.isSkinnedMesh) { m.getVertexPosition(i, v); v.applyMatrix4(m.matrixWorld); if (v.y < skinMin) skinMin = v.y; continue; }

    {

    camTarget.set(0, 1, 0); camDist = 6;
  }
  function applyWire() { for (const m of SG.Figure.material ? [SG.Figure.material] : []) m.wireframe = state.wire; scene.traverse(o => { if (o.material && o.material.name && o.material.name.indexOf('SG.Figure') === 0) o.material.wireframe = state.wire; }); }
